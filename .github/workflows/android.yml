name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Diagnose GestureDetector / Kotlin
        if: always()
        run: |
          echo "=== platforms ==="
          ls "$ANDROID_HOME/platforms"
          echo "=== GestureDetector.SimpleOnGestureListener ==="
          javap -classpath "$ANDROID_HOME/platforms/android-35/android.jar" 'android.view.GestureDetector$SimpleOnGestureListener' 2>&1 | grep -E "onFling|onDown" || echo "no match"
          echo "=== kotlin compiler resolved by gradle ==="
          gradle -q :app:compileDebugKotlin --info --stacktrace 2>&1 | grep -iE "kotlin compiler|kotlinc-|kotlin-compiler-embeddable|Using Kotlin|compiler.*version|classpath.*android.jar|android.jar" | head -60 || true
          echo "=== compile classpath ==="
          gradle -q :app:dependencies --configuration debugCompileClasspath 2>&1 | head -60 || true

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Show Kotlin compiler errors
        if: failure()
        run: |
          echo "=== Kotlin Compiler Problems Report ==="
          cat app/build/reports/problems/problems-report.html || true
