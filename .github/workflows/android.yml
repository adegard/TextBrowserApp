name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK (dump compile classpath)
        run: |
          gradle -I .github/init-print-classpath.gradle :app:assembleDebug --console=plain 2>&1 | tee /tmp/build.log
          echo "=== classpath ==="
          grep -E "COMPILE_CLASSPATH|\.jar|\.aar" /tmp/build.log | head -120
          echo "=== build result ==="
          grep -E "BUILD SUCCESSFUL|BUILD FAILED|overrides nothing|compileDebugKotlin FAILED" /tmp/build.log | head
          grep -q "BUILD SUCCESSFUL" /tmp/build.log

      - name: Show Kotlin compiler errors
        if: failure()
        run: |
          echo "=== Kotlin Compiler Problems Report ==="
          cat app/build/reports/problems/problems-report.html || true
